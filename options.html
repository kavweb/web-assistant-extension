<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>تنظیمات دستیار وب‌گردی</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f5f6f8;--c:#fff;--tx:#232938;--m:#5d6578;--b:#e2e5ec;--p:#4f46e5}
@media(prefers-color-scheme:dark){:root{--bg:#12141a;--c:#1c1f28;--tx:#eceef4;--m:#9aa2b6;--b:#2c3040;--p:#8b85ff}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.9 Vazirmatn,Tahoma,sans-serif}
main{max-width:620px;margin:0 auto;padding:20px}.card{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:16px;margin:14px 0}
label{display:block;margin-top:10px;font-size:14px;color:var(--m)}input[type=text],input[type=password],input[type=number],select,textarea{width:100%;font:inherit;padding:8px;border-radius:10px;border:1px solid var(--b);background:var(--bg);color:var(--tx)}
button{font:inherit;border:1px solid var(--b);background:var(--c);color:var(--tx);border-radius:12px;padding:9px 16px;cursor:pointer;margin-inline-end:8px;margin-top:10px}button.p{background:var(--p);color:#fff;border-color:var(--p)}button.d{color:#dc2626}
.s{font-size:13px;color:var(--m)}#out{margin-top:10px;font-size:14px}a{color:var(--p)}
</style></head><body><main>
<h1>⚙️ تنظیمات دستیار</h1>
<div class="card"><b>مدل هوش مصنوعی</b>
<label>سرویس</label><select id="provider"><option value="gemini">Gemini (سهمیه‌ی رایگان)</option><option value="openrouter">OpenRouter (مدل‌های رایگان)</option><option value="ollama">Ollama (محلی، کاملاً خصوصی)</option></select>
<label>کلید API (فقط روی همین دستگاه ذخیره می‌شود و رمزنگاری نیست)</label><input type="password" id="key" autocomplete="off">
<div class="s">کلید رایگان: <a href="https://aistudio.google.com/apikey" target="_blank">Google AI Studio</a> · <a href="https://openrouter.ai/keys" target="_blank">OpenRouter</a></div>
<label>نام مدل Gemini</label><input type="text" id="geminiModel" dir="ltr">
<label>نام مدل OpenRouter (آخرش :free)</label><input type="text" id="orModel" dir="ltr">
<label>نام مدل Ollama</label><input type="text" id="ollamaModel" dir="ltr">
<div class="s">نام مدل‌های رایگان گاهی عوض می‌شود؛ اگر خطا گرفتید اینجا را به‌روز کنید.</div></div>
<div class="card"><b>مصرف و حریم خصوصی</b>
<label>سقف درخواست در روز</label><input type="number" id="dailyLimit" min="5" max="1000">
<label><input type="checkbox" id="cache"> ذخیره‌ی خلاصه‌ها روی این دستگاه (۷ روز) برای صرفه‌جویی</label>
<label><input type="checkbox" id="proactive"> پیشنهاد فعال: وقتی گیج به نظر می‌رسم، دکمه‌ی کمک چشمک بزند</label>
<label>سایت‌های همیشه‌خاموش (هر خط یک نام، مثل mybank.com)</label><textarea id="sensitive" rows="4" dir="ltr"></textarea>
<div class="s">بانک، ایمیل، پرداخت و صفحه‌های دارای رمز عبور به‌صورت پیش‌فرض خاموش‌اند. مقدار فیلدها هرگز به مدل فرستاده نمی‌شود.</div></div>
<button class="p" id="save">ذخیره</button><button id="test">تست اتصال</button><button class="d" id="clear">پاک کردن همه‌ی اطلاعات من</button>
<div id="out"></div>
</main><script src="options.js"></script></body></html>
